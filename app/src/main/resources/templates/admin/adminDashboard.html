<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />

    <title>Admin Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/style.css}" />

    <!-- Common JS -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/header.js}" defer></script>
    <script th:src="@{/js/footer.js}" defer></script>
</head>

<body onload="renderContent()">

<div class="container">

    <div class="wrapper">

        <!-- Header -->
        <div id="header"></div>

        <!-- Main Content -->
        <main class="main-content">

            <h2>Doctor Management</h2>

            <!-- Search Bar -->
            <input 
                type="text"
                id="searchBar"
                placeholder="Search doctor by name..."
            />

            <!-- Filters -->
            <div class="filters">

                <select id="timeFilter">
                    <option value="">Filter by Time</option>
                    <option value="AM">Morning (AM)</option>
                    <option value="PM">Evening (PM)</option>
                </select>

                <select id="specialtyFilter">
                    <option value="">Filter by Specialty</option>
                    <option value="Cardiology">Cardiologist</option>
                    <option value="Dentist">Dentist</option>
                    <option value="Dermatology">Dermatologist</option>
                </select>

            </div>

            <!-- Dynamic Content -->
            <div id="content"></div>

        </main>

        <!-- Footer -->
        <div id="footer"></div>

    </div>

</div>

<!-- Modal -->
<div id="modal" class="modal">

    <div class="modal-content">

        <span class="close">&times;</span>

        <div id="modal-body"></div>

    </div>

</div>

<!-- Page Specific JS -->
<script type="module" th:src="@{/js/adminDashboard.js}" defer></script>
<script type="module" th:src="@{/js/doctorCard.js}" defer></script>

</body>
</html>
