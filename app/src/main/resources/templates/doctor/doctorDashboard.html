<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />

    <title>Doctor Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/style.css}" />

    <!-- Common JS -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/header.js}" defer></script>
    <script th:src="@{/js/footer.js}" defer></script>

</head>

<body onload="renderContent()">

<div class="container">

    <div class="wrapper">

        <!-- Header -->
        <div id="header"></div>

        <!-- Main Content -->
        <div class="main-content">

            <h2>Doctor Dashboard</h2>

            <!-- Search Bar -->
            <input 
                type="text" 
                id="searchBar" 
                class="searchBar" 
                placeholder="Search patient by name..."
            />

            <!-- Filters -->
            <div class="filters">

                <button id="todayButton">
                    Today's Appointments
                </button>

                <input type="date" id="datePicker">

            </div>

            <!-- Patient Appointment Table -->
            <table class="patientTable">

                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Prescription</th>
                    </tr>
                </thead>

                <tbody id="patientTableBody">
                    <!-- Dynamic rows inserted via doctorDashboard.js -->
                </tbody>

            </table>

        </div>

        <!-- Footer -->
        <div id="footer"></div>

    </div>

</div>

<!-- Page Specific Script -->
<script type="module" th:src="@{/js/doctorDashboard.js}" defer></script>

</body>
</html>
